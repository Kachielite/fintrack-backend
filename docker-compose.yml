services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWERCASENAME}:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Always point at the Redis sidecar; overrides any REDIS_URL in .env
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3000'
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file keeps jobs durable across container restarts
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
