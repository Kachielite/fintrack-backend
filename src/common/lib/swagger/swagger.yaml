openapi: 3.0.0
info:
  title: FinTrack API
  version: 1.0.0
  description: FinTrack backend API

servers:
  - url: /api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Error envelopes ──────────────────────────────────────────────────────
    Unauthorized:
      type: object
      properties:
        statusCode:
          type: integer
          example: 401
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Invalid or expired token

    NotFound:
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        error:
          type: string
          example: Resource Not Found
        message:
          type: string
          example: Resource not found

    BadRequest:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed

    InternalServerError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 500
        error:
          type: string
          example: Internal Server Error
        message:
          type: string
          example: An unexpected error occurred

    # ── Generic success ───────────────────────────────────────────────────────
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          nullable: true
          example: null

    # ── Auth ─────────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: jane@example.com
        first_name:
          type: string
          example: Jane
        onboarding_complete:
          type: boolean
          example: false

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJpZCI6MX0.abc123
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJpZCI6MX0.def456
        user:
          $ref: '#/components/schemas/AuthUser'

    TokenRefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJpZCI6MX0.newtoken123

    # ── User ─────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: jane@example.com
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          nullable: true
          example: Doe
        ref_currency:
          type: string
          example: NGN
        advisor_tone:
          type: string
          nullable: true
          example: motivational
        goal_type:
          type: string
          nullable: true
          example: save_money
        income_range:
          type: string
          nullable: true
          example: 500k-1m
        pay_frequency:
          type: string
          nullable: true
          example: monthly
        onboarding_complete:
          type: boolean
          example: true
        plan_tier:
          type: string
          example: free
        created_at:
          type: string
          format: date-time
          example: '2026-01-15T10:00:00.000Z'

    # ── Bank ─────────────────────────────────────────────────────────────────
    Bank:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Access Bank
        shortCode:
          type: string
          example: ACCESS
        country:
          type: string
          nullable: true
          example: NG
        logoUrl:
          type: string
          nullable: true
          example: 'https://cdn.example.com/access.png'
        isActive:
          type: boolean
          example: true

    # ── Account ──────────────────────────────────────────────────────────────
    Account:
      type: object
      properties:
        id:
          type: integer
          example: 1
        bank_id:
          type: integer
          nullable: true
          example: 2
        bank_name:
          type: string
          nullable: true
          example: Access Bank
        bank_logo_url:
          type: string
          nullable: true
          example: 'https://cdn.example.com/access.png'
        currency:
          type: string
          example: NGN
        label:
          type: string
          example: Access Bank (NGN)
        account_number_mask:
          type: string
          nullable: true
          example: '4821'
        is_active:
          type: boolean
          example: true
        balance:
          type: number
          nullable: true
          description: Sourced from this account's most recent transaction that captured a balance; null if none has.
          example: 158420.5
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-12T07:23:39.621Z'
        created_at:
          type: string
          format: date-time
          example: '2026-01-20T08:00:00.000Z'

    RescanTransfersResult:
      type: object
      properties:
        scanned:
          type: integer
          description: Transactions actually run through detection this pass (a transaction claimed by an earlier match in the same pass is skipped, not counted).
          example: 42
        linked:
          type: integer
          description: Transactions newly excluded from totals — as a matched pair or a single unlinked currency_conversion leg.
          example: 3

    # ── Email Connection ──────────────────────────────────────────────────────
    EmailConnection:
      type: object
      properties:
        id:
          type: integer
          example: 1
        gmail_address:
          type: string
          example: jane@gmail.com
        status:
          type: string
          example: active
        gmail_label_id:
          type: string
          nullable: true
          example: Label_12345
        gmail_label_name:
          type: string
          nullable: true
          example: Bank Alerts
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-09T08:00:00.000Z'
        created_at:
          type: string
          format: date-time
          example: '2026-01-20T08:00:00.000Z'

    GmailLabel:
      type: object
      properties:
        id:
          type: string
          example: Label_12345
        name:
          type: string
          example: Bank Alerts
        messages_total:
          type: integer
          example: 48

    GmailAuthUrl:
      type: object
      properties:
        url:
          type: string
          example: 'https://accounts.google.com/o/oauth2/auth?client_id=...'

    # ── Parser Rules ──────────────────────────────────────────────────────────
    ParserRule:
      type: object
      properties:
        id:
          type: integer
          example: 5
        fieldName:
          type: string
          example: amount
        regexPattern:
          type: string
          example: 'NGN([\d,]+\.\d{2})'
        captureGroup:
          type: integer
          example: 1
        transformType:
          type: string
          nullable: true
          example: parse_amount

    ParserTemplate:
      type: object
      properties:
        id:
          type: integer
          example: 1
        bankId:
          type: integer
          example: 1
        name:
          type: string
          example: Access Bank Debit Alert
        status:
          type: string
          example: production
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ParserRule'

    AuditResult:
      type: object
      properties:
        passed:
          type: boolean
          example: true
        issues:
          type: array
          items:
            type: string
          example: []
        suggestions:
          type: array
          items:
            type: string
          example:
            - 'Consider adding a fallback pattern for amounts without decimal points'

    # ── Transaction ───────────────────────────────────────────────────────────
    Transaction:
      type: object
      properties:
        id:
          type: integer
          example: 42
        merchant:
          type: string
          example: Shoprite
        category:
          type: string
          example: groceries
        transactionType:
          type: string
          example: debit
        amount:
          type: number
          example: -5000
        currency:
          type: string
          example: NGN
        refAmount:
          type: number
          example: -5000
        refCurrency:
          type: string
          example: NGN
        transactionDate:
          type: string
          format: date-time
          example: '2026-05-01T14:30:00.000Z'
        status:
          type: string
          example: verified
        bankId:
          type: integer
          nullable: true
          example: 1
        accountId:
          type: integer
          nullable: true
          example: 3
        excludeFromTotals:
          type: boolean
          description: True when this transaction is a matched or independently-flagged transfer/conversion leg, so it's excluded from spend/income totals.
          example: false

    PaginatedTransactions:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total_items:
          type: integer
          example: 145
        pages:
          type: integer
          example: 8
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

    DailySpendPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: '2026-05-14'
        spend:
          type: number
          example: 12500
        income:
          type: number
          example: 0
        net:
          type: number
          description: income - spend, in the user's ref currency.
          example: -12500

    MonthSpendSummary:
      type: object
      properties:
        spend:
          type: number
          example: 158000
        income:
          type: number
          example: 320000
        net:
          type: number
          example: 162000

    DailySpendResponse:
      type: object
      properties:
        month:
          $ref: '#/components/schemas/MonthSpendSummary'
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailySpendPoint'

    RetentionStatus:
      type: object
      properties:
        retentionMonths:
          type: number
          description: How many months of history this user's plan retains
          example: 2
        transactionsAtRisk:
          type: number
          description: Count of transactions already past the retention cutoff
          example: 12
        cutoffDate:
          type: string
          format: date-time

    CreateManualTransaction:
      type: object
      required: [merchant, category, transaction_type, amount, currency, transaction_date]
      properties:
        merchant:
          type: string
          example: Coffee shop
        category:
          type: string
          example: dining
        transaction_type:
          type: string
          enum: [debit, credit]
        amount:
          type: number
          description: Always positive — sign is derived from transaction_type
          example: 2500
        currency:
          type: string
          example: NGN
        transaction_date:
          type: string
          format: date-time
        account_id:
          type: number
          description: Existing account to attach this to. Omit to auto-resolve/create one for the given currency.
        reference:
          type: string
        balance:
          type: number

    ImportResult:
      type: object
      properties:
        imported:
          type: number
          example: 42
        skippedDuplicates:
          type: number
          example: 3
        skippedInvalid:
          type: number
          example: 1
        errors:
          type: array
          items:
            type: string
          description: Up to 20 human-readable per-row error messages

    CategorySpend:
      type: object
      properties:
        category:
          type: string
          example: groceries
        total:
          type: number
          example: 35000

    CurrencyBreakdown:
      type: object
      properties:
        currency:
          type: string
          example: USD
        total:
          type: number
          example: 120.50

    TransactionSummary:
      type: object
      properties:
        period_start:
          type: string
          format: date-time
          example: '2026-05-01T00:00:00.000Z'
        period_end:
          type: string
          format: date-time
          example: '2026-05-31T23:59:59.000Z'
        total_spend:
          type: number
          example: 125000
        total_income:
          type: number
          example: 350000
        net:
          type: number
          example: 225000
        ref_currency:
          type: string
          example: NGN
        by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategorySpend'
        by_currency:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyBreakdown'
        vs_last_period_pct:
          type: number
          nullable: true
          example: 12.5

    # ── Exchange Rate ─────────────────────────────────────────────────────────
    ExchangeRate:
      type: object
      properties:
        base_currency:
          type: string
          example: NGN
        target_currency:
          type: string
          example: USD
        rate:
          type: number
          example: 0.00063
        fetched_at:
          type: string
          format: date-time
          example: '2026-05-09T08:00:00.000Z'

    # ── Budget ────────────────────────────────────────────────────────────────
    BudgetWithProgress:
      type: object
      properties:
        id:
          type: integer
          example: 3
        category:
          type: string
          example: groceries
        limit_amount:
          type: number
          example: 50000
        currency:
          type: string
          example: NGN
        period_type:
          type: string
          example: monthly
        is_suggested_by_ai:
          type: boolean
          example: false
        spent:
          type: number
          example: 32000
        remaining:
          type: number
          example: 18000
        percentage:
          type: number
          example: 64
        status:
          type: string
          enum: [healthy, warning, over]
          example: healthy
        days_remaining:
          type: integer
          example: 14

    MerchantBreakdown:
      type: object
      properties:
        merchant:
          type: string
          example: Shoprite
        total:
          type: number
          example: 18000
        percentage_of_budget:
          type: number
          example: 36
        transaction_count:
          type: integer
          example: 4

    BudgetTransactionItem:
      type: object
      properties:
        id:
          type: integer
          example: 42
        merchant:
          type: string
          example: Shoprite
        bank:
          type: string
          example: Access Bank
        amount:
          type: number
          example: -5000
        currency:
          type: string
          example: NGN
        ref_amount:
          type: number
          example: -5000
        time:
          type: string
          example: '14:32'
        status:
          type: string
          example: verified

    BudgetDateGroup:
      type: object
      properties:
        date_group:
          type: string
          example: TODAY
        items:
          type: array
          items:
            $ref: '#/components/schemas/BudgetTransactionItem'

    BudgetDetail:
      allOf:
        - $ref: '#/components/schemas/BudgetWithProgress'
        - type: object
          properties:
            transaction_count:
              type: integer
              example: 8
            merchant_breakdown:
              type: array
              items:
                $ref: '#/components/schemas/MerchantBreakdown'
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/BudgetDateGroup'

    BudgetSuggestion:
      type: object
      properties:
        category:
          type: string
          example: dining
        suggested_limit:
          type: number
          example: 30000
        message:
          type: string
          example: 'Based on your last 3 months, ₦30,000 covers your typical dining spend with a 10% buffer.'

    # ── Goal ─────────────────────────────────────────────────────────────────
    Goal:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: Emergency Fund
        type:
          type: string
          example: emergency_fund
        targetAmount:
          type: number
          nullable: true
          example: 500000
        savedAmount:
          type: number
          example: 125000
        currency:
          type: string
          example: NGN
        targetDate:
          type: string
          format: date-time
          nullable: true
          example: '2026-12-31T00:00:00.000Z'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-01T08:00:00.000Z'

    # ── Insight ───────────────────────────────────────────────────────────────
    Insight:
      type: object
      properties:
        id:
          type: integer
          example: 7
        type:
          type: string
          example: spending_spike
        message:
          type: string
          example: 'Your dining spend jumped 40% this month — ₦42,000 vs ₦30,000 last month.'
        contextData:
          type: object
          nullable: true
          example:
            category: dining
            current_spend: 42000
            previous_spend: 30000
        isRead:
          type: boolean
          example: false
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-06-09T02:30:00.000Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-05-09T02:30:00.000Z'

    # ── Admin Auth ───────────────────────────────────────────────────────────
    AdminAuthToken:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            access_token: { type: string, example: 'eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoiYWRtaW4ifQ.sig' }
            expires_in: { type: string, example: '4h' }

    AdminMe:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: integer, example: 1 }
            email: { type: string, example: 'admin@fintrack.app' }

    # ── Admin Overview ────────────────────────────────────────────────────────
    AdminOverview:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            snapshot_at: { type: string, format: date-time, example: '2026-05-09T20:00:00.000Z' }
            transactions:
              type: object
              properties:
                total_count: { type: integer, example: 12540 }
                total_count_30d: { type: integer, example: 340 }
                handled_by_regex: { type: integer, example: 10200 }
                handled_by_ai: { type: integer, example: 2340 }
                regex_rate_pct: { type: number, example: 81.34 }
                regex_rate_30d_pct: { type: number, example: 84.12 }
                failed_ingestion_count: { type: integer, example: 7 }
                unverified_count: { type: integer, example: 42 }
            regex_engine:
              type: object
              properties:
                total_templates: { type: integer, example: 28 }
                production: { type: integer, example: 22 }
                candidate: { type: integer, example: 4 }
                failed_audit: { type: integer, example: 2 }
                degrading: { type: integer, example: 1 }
                avg_confidence_score: { type: number, example: 0.8912 }
                banks_with_coverage: { type: integer, example: 8 }
                banks_without_coverage: { type: integer, example: 2 }
            users:
              type: object
              properties:
                total: { type: integer, example: 1820 }
                active_30d: { type: integer, example: 312 }
                plan_free: { type: integer, example: 1400 }
                plan_pro: { type: integer, example: 350 }
                plan_premium: { type: integer, example: 70 }
                onboarding_complete: { type: integer, example: 1600 }
                email_connected: { type: integer, example: 1750 }
            ingestion:
              type: object
              properties:
                connections_active: { type: integer, example: 1748 }
                connections_stale: { type: integer, example: 12 }
                emails_processed_30d: { type: integer, example: 4230 }
                emails_failed_30d: { type: integer, example: 27 }
                avg_parse_time_ms: { type: number, nullable: true, example: null }
            ai_cost:
              type: object
              properties:
                estimated_cost_today_usd: { type: number, example: 0.043 }
                estimated_cost_30d_usd: { type: number, example: 1.27 }
                total_tokens_30d: { type: integer, example: 508000 }
                cost_per_transaction_30d: { type: number, example: 0.000374 }

    # ── Admin Regex ───────────────────────────────────────────────────────────
    AdminRegexHealth:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            as_of: { type: string, format: date-time, example: '2026-05-09T20:00:00.000Z' }
            overall_regex_rate_pct: { type: number, example: 81.34 }
            trend:
              type: array
              items:
                type: object
                properties:
                  date: { type: string, example: '2026-05-09' }
                  regex_count: { type: integer, example: 112 }
                  ai_count: { type: integer, example: 21 }
                  regex_rate_pct: { type: number, example: 84.21 }
            by_bank:
              type: array
              items:
                type: object
                properties:
                  bank_id: { type: integer, example: 1 }
                  bank_name: { type: string, example: GTBank }
                  short_code: { type: string, example: gtbank }
                  production_templates: { type: integer, example: 3 }
                  avg_confidence: { type: number, example: 0.91 }
                  transaction_count_30d: { type: integer, example: 280 }
                  regex_rate_pct: { type: number, example: 92.5 }
                  correction_rate_pct: { type: number, example: 2.1 }
                  status: { type: string, enum: [healthy, degrading, no_coverage], example: healthy }
            templates_added_30d: { type: integer, example: 2 }
            templates_modified_30d: { type: integer, example: 5 }
            templates_deprecated_30d: { type: integer, example: 0 }

    AdminRegexTemplateList:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            page: { type: integer, example: 1 }
            limit: { type: integer, example: 25 }
            total_items: { type: integer, example: 28 }
            pages: { type: integer, example: 2 }
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer, example: 4 }
                  bank_name: { type: string, example: GTBank }
                  version: { type: integer, example: 3 }
                  description: { type: string, nullable: true, example: 'GTBank debit alert v3' }
                  status: { type: string, example: production }
                  confidence_score: { type: number, example: 0.92 }
                  match_count: { type: integer, example: 3410 }
                  fail_count: { type: integer, example: 28 }
                  correction_count: { type: integer, example: 14 }
                  created_by: { type: string, example: ai }
                  audit_passed_at: { type: string, nullable: true, example: '2026-02-01T09:00:00.000Z' }
                  promoted_at: { type: string, nullable: true, example: '2026-02-02T10:00:00.000Z' }
                  last_failed_at: { type: string, nullable: true, example: null }
                  created_at: { type: string, example: '2026-01-28T14:00:00.000Z' }

    AdminAuditQueue:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total_pending: { type: integer, example: 3 }
            items:
              type: array
              items:
                type: object
                properties:
                  template_id: { type: integer, example: 17 }
                  bank_name: { type: string, example: 'Kuda Bank' }
                  version: { type: integer, example: 1 }
                  created_at: { type: string, format: date-time, example: '2026-05-08T11:00:00.000Z' }
                  hours_waiting: { type: number, example: 33.5 }
                  triggered_by_tx_id: { type: integer, nullable: true, example: 9821 }

    AdminRegexGaps:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total_banks_with_gaps: { type: integer, example: 2 }
            items:
              type: array
              items:
                type: object
                properties:
                  bank_id: { type: integer, example: 5 }
                  bank_name: { type: string, example: Moniepoint }
                  short_code: { type: string, example: moniepoint }
                  unhandled_tx_count: { type: integer, example: 47 }
                  oldest_unhandled_at: { type: string, example: '2026-04-15' }
                  candidate_template_exists: { type: boolean, example: false }

    AdminRegexCorrections:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  template_id: { type: integer, example: 4 }
                  bank_name: { type: string, example: GTBank }
