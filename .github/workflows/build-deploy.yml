name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.yml"
          target: "~/fintrack-backend/"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            mkdir -p ~/fintrack-backend
            cd ~/fintrack-backend/
            echo "Logging in to GHCR..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "Creating/Updating environment variables..."
            cat <<EOF > .env
            NODE_ENV=production
            PORT=3000
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_PRIVATE_KEY=${{ secrets.APPLE_PRIVATE_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
            OPENAI_MODE=${{ secrets.OPENAI_MODE }}
            OPENAI_MODEL_EXTRACTION=${{ secrets.OPENAI_MODEL_EXTRACTION }}
            OPENAI_MODEL_TEMPLATE=${{ secrets.OPENAI_MODEL_TEMPLATE }}
            OPENAI_MODEL_AUDIT=${{ secrets.OPENAI_MODEL_AUDIT }}
            OPENAI_MODEL_CLASSIFY=${{ secrets.OPENAI_MODEL_CLASSIFY }}
            OPENAI_MODEL_BUDGET=${{ secrets.OPENAI_MODEL_BUDGET }}
            OPENAI_MODEL_INSIGHT=${{ secrets.OPENAI_MODEL_INSIGHT }}
            OPEN_EXCHANGE_RATES_APP_ID=${{ secrets.OPEN_EXCHANGE_RATES_APP_ID }}
            TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}
            GMAIL_POLL_INTERVAL_MINUTES=${{ secrets.GMAIL_POLL_INTERVAL_MINUTES }}
            REGEX_PRODUCTION_THRESHOLD=${{ secrets.REGEX_PRODUCTION_THRESHOLD }}
            REGEX_REAUDIT_THRESHOLD=${{ secrets.REGEX_REAUDIT_THRESHOLD }}
            FRONTEND_ORIGIN=${{ secrets.FRONTEND_ORIGIN }}
            GITHUB_REPOSITORY_LOWERCASENAME=${{ github.repository }}
            EOF
            sed -i "s|GITHUB_REPOSITORY_LOWERCASENAME=.*|GITHUB_REPOSITORY_LOWERCASENAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')|" .env
            echo "Pulling latest images..."
            docker compose pull
            echo "Starting containers..."
            docker compose up -d
            echo "Cleanup old images..."
            docker image prune -f

